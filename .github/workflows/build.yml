name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository content
        run: ls -la

      - name: Extract project from zip
        run: |
          if [ -f petlist_test.zip ]; then
            unzip -l petlist_test.zip || true
            rm -rf lib assets icon android pubspec.yaml pubspec.lock README.md tool supabase || true
            rm -rf _unz; mkdir -p _unz
            unzip -o petlist_test.zip -d _unz || true
            PUB=$(find _unz -name pubspec.yaml | head -1)
            if [ -n "$PUB" ]; then
              cp -rf "$(dirname "$PUB")"/. .
            fi
            rm -rf _unz
          else
            echo "no zip found, using files already in repo"
          fi
          echo "----- files now -----"
          ls -la
          echo "----- pubspec version -----"
          if [ -f pubspec.yaml ]; then grep -E "^version" pubspec.yaml; else echo "NO pubspec.yaml"; fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare android project
        run: flutter create --platforms=android --org com.example --project-name petlist_test .

      - name: Add internet permission
        run: |
          F=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$F"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$F"
          fi
          echo "----- INTERNET permission check -----"
          grep -n "INTERNET" "$F"

      - name: Apply custom launcher icon
        run: |
          RES=android/app/src/main/res
          if [ -d icon ]; then
            rm -rf "$RES"/mipmap-* || true
            cp -rf icon/mipmap-* "$RES"/
            rm -f "$RES"/mipmap-anydpi-v26/ic_launcher*.xml || true
          fi
          echo "----- final launcher icons -----"
          find "$RES" -name "ic_launcher*" -exec ls -la {} \; || true

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: petlist-apk
          path: build/app/outputs/flutter-apk/app-release.apk
