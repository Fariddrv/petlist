name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project from newest zip
        run: |
          ZIP=""
          BEST=-1
          for f in *.zip; do
            [ -f "$f" ] || continue
            T=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
            echo "found zip: $f (commit time $T)"
            if [ "${T:-0}" -gt "$BEST" ]; then BEST=$T; ZIP="$f"; fi
          done
          if [ -z "$ZIP" ]; then
            echo "ERROR: no .zip file found in the repository root"
            ls -la
            exit 1
          fi
          echo "using zip: $ZIP"
          rm -rf lib assets icon android pubspec.yaml pubspec.lock README.md tool supabase || true
          rm -rf _unz; mkdir -p _unz
          unzip -o "$ZIP" -d _unz
          PUB=$(find _unz -name pubspec.yaml | head -1)
          if [ -z "$PUB" ]; then
            echo "ERROR: pubspec.yaml not found inside $ZIP"
            exit 1
          fi
          cp -rf "$(dirname "$PUB")"/. .
          rm -rf _unz
          grep -E "^version" pubspec.yaml
          ls tool

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare android project
        run: flutter create --platforms=android --org com.example --project-name petlist_test .

      - name: Android setup from project
        run: python3 tool/android_setup.py

      - name: Apply custom launcher icon
        run: |
          RES=android/app/src/main/res
          if [ -d icon ]; then
            rm -rf "$RES"/mipmap-* || true
            cp -rf icon/mipmap-* "$RES"/
            rm -f "$RES"/mipmap-anydpi-v26/ic_launcher*.xml || true
          fi

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: petlist-apk
          path: build/app/outputs/flutter-apk/app-release.apk
